<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Windfold</title>

    <meta
      name="description"
      content="A daily paper-plane gliding game in the browser. One landscape a day, the same for everyone on Earth. Ride the thermals, beat the paper pilot, fly windfolded."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social cards. The image is the game's own splash on a blossom day —
         the product selling itself. og:url and og:image assume windfold.app;
         adjust if the deploy lands elsewhere. -->
    <meta property="og:title" content="Windfold" />
    <meta
      property="og:description"
      content="A daily paper-plane gliding game. One landscape a day, the same for everyone. Fly windfolded."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://windfold.app/" />
    <meta property="og:image" content="https://windfold.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Windfold" />
    <meta
      name="twitter:description"
      content="A daily paper-plane gliding game. One landscape a day, the same for everyone. Fly windfolded."
    />
    <meta name="twitter:image" content="https://windfold.app/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
